<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helldivers 2 攻略列表</title>
  <link rel="stylesheet" href="site.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4435032913873442"
     crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><div class="brand-mark">H2</div><div>Helldivers 2 战术简报站</div></div>
      <nav aria-label="主导航">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="list.html">文章列表</a>
        <a class="nav-link" href="newbie.html">新手</a>
        <a class="nav-link" href="weapons.html">武器</a>
        <a class="nav-link" href="missions.html">任务</a>
      </nav>
      <div class="search"><input id="listSearch" type="search" placeholder="搜索文章标题 / 标签" aria-label="搜索文章" /></div>
      <a class="nav-cta" href="index.html#quick">返回首页</a>
    </div>
  </header>

  <main class="container">
    <section class="card hero-main" style="margin-top:20px; padding:24px;">
      <div class="badge">文章列表页 · 分类 / 筛选 / 排序 / 分页</div>
      <h1 style="max-width:none; margin-top:14px;">攻略目录</h1>
      <p class="lead">这里是所有攻略文章的统一入口，支持按分类、标签和更新时间筛选，像真正的游戏攻略站目录页一样浏览。</p>
      <div class="hero-tags" id="categoryFilters"></div>
      <div class="hero-actions">
        <button class="btn btn-secondary" id="sortLatest">按最新</button>
        <button class="btn btn-secondary" id="sortPopular">按热门</button>
      </div>
    </section>

    <section class="section card">
      <div class="section-head">
        <div><h2>全部文章</h2><p>点击文章进入统一详情页。</p></div>
        <span class="tag alt" id="countLabel"></span>
      </div>
      <div class="content-grid" id="articleGrid"></div>
      <div class="pagination" id="pagination"></div>
    </section>
  </main>

  <script>
    const articles = [
      { id: 'newbie-quick-start', title: '新手 10 分钟入门', category: '新手', updatedAt: '2026-05-09', summary: '值不值得玩、前期做什么、先解锁什么、如何少踩坑。', tags: ['新手', '入坑', '开荒'] },
      { id: 'best-loadout', title: '当前版本最稳配装', category: '版本', updatedAt: '2026-05-09', summary: '围绕版本环境整理武器、护甲、投掷物和 Stratagem 组合。', tags: ['版本', '配装', '武器'] },
      { id: 'enemy-factions', title: '虫族 / 机器人打法', category: '打法', updatedAt: '2026-05-09', summary: '按阵营拆解战术、跑位、清怪、保命和撤离思路。', tags: ['虫族', '机器人', '打法'] },
      { id: 'single-player', title: '单刷 / 双排 / 四排', category: '模式', updatedAt: '2026-05-09', summary: '不同人数的打法区别、职责分工和沟通重点。', tags: ['单人', '开黑', '队伍'] },
      { id: 'weapon-guide', title: '当前版本强势武器推荐', category: '武器', updatedAt: '2026-05-09', summary: '按清杂、对甲、控场、容错四类场景整理。', tags: ['版本', '武器', '高优先级'] },
      { id: 'mission-guide', title: '防守 / 撤离任务', category: '任务', updatedAt: '2026-05-09', summary: '最容易翻车的节点，优先给出保命和沟通策略。', tags: ['任务', '防守', '撤离'] },
      { id: 'team-roles', title: '团队分工模板', category: '团队', updatedAt: '2026-05-09', summary: '输出、控场、补给、救援四个角色的分配建议。', tags: ['开黑', '分工', '团队'] },
      { id: 'strategy-guide', title: '战略配备指南：种类详解与排名', category: '版本', updatedAt: '2026-05-09', summary: '围绕支援武器、轨道、鹰式、哨兵和背包，整理一套更适合实战的选择思路。', tags: ['战略配备', '支持武器', '鹰式打击'] },
      { id: 'major-orders-guide', title: 'Major Orders 指南：赢得银河战争的胜利', category: '任务', updatedAt: '2026-05-09', summary: '解释 Major Orders 的意义、为什么常失败，以及普通玩家如何有效贡献。', tags: ['Major Orders', '银河战争', '社区协作'] },
      { id: 'nest-guide', title: '巢穴攻略：无伤摧毁，避免被围攻', category: '虫族', updatedAt: '2026-05-09', summary: '围绕虫族巢穴的安全距离、拆除顺序、武器选择与撤离节奏。', tags: ['虫族', '巢穴', '可选目标'] },
      { id: 'mission-types-guide', title: '任务类型详解指南', category: '任务', updatedAt: '2026-05-09', summary: '把行动、主目标、可选目标、战役类型和奖励机制拆开讲清楚。', tags: ['任务', '流程', '可选目标'] },
      { id: 'weapon-guide', title: '当前版本强势武器推荐', category: '武器', updatedAt: '2026-05-09', summary: '按清杂、对甲、控场、容错四类场景整理。', tags: ['版本', '武器', '高优先级'] }
    ];
    const pageSize = 4;
    const maxPagerButtons = 5;
    let currentPage = 1;
    let currentCategory = '全部';
    let currentSort = 'latest';
    const search = document.getElementById('listSearch');
    const grid = document.getElementById('articleGrid');
    const pagination = document.getElementById('pagination');
    const countLabel = document.getElementById('countLabel');

    const categories = ['全部', ...new Set(articles.map(a => a.category))];
    document.getElementById('categoryFilters').innerHTML = categories.map(c => `<span class="chip ${c==='全部'?'active':''}" data-category="${c}">${c}</span>`).join('');

    function getFiltered() {
      let items = [...articles];
      const q = search.value.trim().toLowerCase();
      if (currentCategory !== '全部') items = items.filter(a => a.category === currentCategory);
      if (q) items = items.filter(a => a.title.toLowerCase().includes(q) || a.tags.join(' ').toLowerCase().includes(q) || a.summary.toLowerCase().includes(q));
      items.sort((a, b) => currentSort === 'latest' ? b.updatedAt.localeCompare(a.updatedAt) : a.title.localeCompare(b.title));
      return items;
    }

    function renderPager(totalPages) {
      const buttons = [];
      const addBtn = (label, page, cls = '') => buttons.push(`<button class="page-btn ${cls}" data-page="${page}" ${page === null ? 'disabled' : ''}>${label}</button>`);
      addBtn('‹', Math.max(1, currentPage - 1), 'ghost');
      const half = Math.floor(maxPagerButtons / 2);
      let start = Math.max(1, currentPage - half);
      let end = Math.min(totalPages, start + maxPagerButtons - 1);
      start = Math.max(1, end - maxPagerButtons + 1);
      if (start > 1) {
        addBtn('1', 1, currentPage === 1 ? 'active' : '');
        if (start > 2) buttons.push('<span class="page-btn ghost" style="display:grid;place-items:center;cursor:default;">…</span>');
      }
      for (let p = start; p <= end; p++) addBtn(String(p), p, p === currentPage ? 'active' : '');
      if (end < totalPages) {
        if (end < totalPages - 1) buttons.push('<span class="page-btn ghost" style="display:grid;place-items:center;cursor:default;">…</span>');
        addBtn(String(totalPages), totalPages, currentPage === totalPages ? 'active' : '');
      }
      addBtn('›', Math.min(totalPages, currentPage + 1), 'ghost');
      pagination.innerHTML = buttons.join('');
    }

    function render() {
      const items = getFiltered();
      const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
      currentPage = Math.min(currentPage, totalPages);
      const start = (currentPage - 1) * pageSize;
      const view = items.slice(start, start + pageSize);
      countLabel.textContent = `共 ${items.length} 篇`;
      grid.innerHTML = view.map(item => `
        <a class="article-link" href="articles/${item.id}.html">
          <article class="content-card">
            <div class="content-top"><h3>${item.title}</h3><span class="content-badge">${item.updatedAt}</span></div>
            <p>${item.summary}</p>
            <div class="meta-list"><span class="tag">${item.category}</span>${item.tags.map(t=>`<span class="tag alt">${t}</span>`).join('')}</div>
          </article>
        </a>
      `).join('') || '<div class="detail-card">没有找到匹配的文章。</div>';
      renderPager(totalPages);
    }

    document.getElementById('categoryFilters').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('#categoryFilters .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentCategory = chip.dataset.category;
      currentPage = 1;
      render();
    });

    search.addEventListener('input', () => { currentPage = 1; render(); });
    document.getElementById('sortLatest').addEventListener('click', () => { currentSort = 'latest'; currentPage = 1; render(); });
    document.getElementById('sortPopular').addEventListener('click', () => { currentSort = 'popular'; currentPage = 1; render(); });
    pagination.addEventListener('click', e => {
      const btn = e.target.closest('button[data-page]');
      if (!btn) return;
      currentPage = Number(btn.dataset.page);
      render();
    });

    render();
  </script>
</body>
</html>
