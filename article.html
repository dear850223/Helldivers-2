<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helldivers 2 文章详情</title>
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><div class="brand-mark">H2</div><div>Helldivers 2 战术简报站</div></div>
      <nav aria-label="主导航">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="newbie.html">新手</a>
        <a class="nav-link" href="weapons.html">武器</a>
        <a class="nav-link" href="missions.html">任务</a>
      </nav>
      <div class="search"><input type="search" placeholder="搜索武器 / 任务 / 阵营 / 配装" aria-label="搜索" /></div>
      <a class="nav-cta" href="index.html#quick">返回首页</a>
    </div>
  </header>

  <main class="container">
    <div class="detail-layout">
      <article class="detail-card" id="articleRoot">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="article-meta" id="articleMeta"></div>
        <h1 class="article-title" id="articleTitle"></h1>
        <p class="article-summary" id="articleSummary"></p>
        <div class="article-body" id="articleBody"></div>
      </article>
      <aside class="sidebar-card">
        <h2 style="margin-top:0;">文章目录</h2>
        <div class="toc-list" id="toc"></div>
        <div style="height:18px"></div>
        <h2>相关推荐</h2>
        <div class="related-list" id="relatedList"></div>
      </aside>
    </div>
  </main>

  <script src="site.js"></script>
  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || 'newbie-quick-start';
    const article = window.HD2_UTILS.getArticle(id) || window.HD2_CONTENTS[0];
    const related = window.HD2_UTILS.relatedArticles(article);

    document.title = `${article.title} - Helldivers 2 攻略站`;
    document.getElementById('breadcrumb').innerHTML = `
      <a href="index.html">首页</a><span>/</span><a href="${article.route || 'index.html'}">专题</a><span>/</span><span>${article.title}</span>
    `;

    document.getElementById('articleMeta').innerHTML = `
      <span class="tag">${article.category}</span>
      ${article.tags.map(tag => `<span class="tag alt">${tag}</span>`).join('')}
      <span class="tag good">更新于 ${article.updatedAt}</span>
    `;
    document.getElementById('articleTitle').textContent = article.title;
    document.getElementById('articleSummary').textContent = article.summary;

    document.getElementById('articleBody').innerHTML = article.body.map((p, idx) => `
      <section class="article-section" id="p${idx + 1}">
        <h2>段落 ${idx + 1}</h2>
        <p>${p}</p>
      </section>
    `).join('');

    document.getElementById('toc').innerHTML = article.body.map((_, idx) => `<a href="#p${idx+1}">段落 ${idx+1}</a>`).join('');
    document.getElementById('relatedList').innerHTML = related.map(item => `
      <a href="article.html?id=${item.id}">
        <div class="detail-card" style="padding:14px;">
          <div class="tag">${item.category}</div>
          <div style="margin-top:8px; font-weight:800;">${item.title}</div>
          <div style="color:var(--muted); font-size:13px; margin-top:6px;">${item.summary}</div>
        </div>
      </a>
    `).join('');
  </script>
</body>
</html>
